services:
  mysql:
    image: mysql:8.0
    container_name: rces-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: adminbms
      MYSQL_DATABASE: rces
      TZ: Europe/Amsterdam
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rces-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 2520
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rces?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: adminbms
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "2520:2520"

volumes:
  mysql_data:
