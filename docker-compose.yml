version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=adminbms
      - MYSQL_DATABASE=rces
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
volumes:
  mysql_data: