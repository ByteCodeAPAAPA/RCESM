version: "3.8"
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # чтобы Jenkins мог запускать Docker
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=adminbms
      - MYSQL_DATABASE=rces
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
volumes:
  jenkins_home:
  mysql_data: