services:
  mysql:
    image: mysql:8.0
    container_name: rcesm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rcesm
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: rcesm-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "2520:2520"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rcesm
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  tests:
    image: gradle:8.8-jdk17
    container_name: rcesm-tests
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rcesm
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    command: >
      sh -c "
        chmod +x ./gradlew &&
        ./gradlew --no-daemon runAllTests
      "