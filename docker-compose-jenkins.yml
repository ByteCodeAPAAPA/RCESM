services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile-jenkins
    container_name: rces-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Amsterdam
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true

volumes:
  jenkins_home:
